name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-platform-mcp:
    name: Build Platform MCP (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mcp-servers/platform/node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/platform/node
      - name: Build TypeScript
        run: pnpm run build
        working-directory: mcp-servers/platform/node

  build-automation-mcp:
    name: Build Automation MCP (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mcp-servers/automation/node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/automation/node
      - name: Build TypeScript
        run: pnpm run build
        working-directory: mcp-servers/automation/node

  test-node:
    name: Test (Node.js)
    runs-on: ubuntu-latest
    needs: [build-platform-mcp, build-automation-mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            mcp-servers/platform/node/pnpm-lock.yaml
            mcp-servers/automation/node/pnpm-lock.yaml
            tests/node/pnpm-lock.yaml
      # The cliFlags tests assert Node and Python send identical API params, so they
      # shell out to `python cli.py` -- this job needs the Python CLI's deps too.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python CLI dependencies
        run: pip install -r requirements.txt
      # cli-tools/*/node/cli.js resolves axios and dotenv from the repo root, so the
      # root install is required before any test that spawns a CLI.
      - name: Install root CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Install MCP server dependencies
        run: |
          cd mcp-servers/platform/node && pnpm install --frozen-lockfile
          cd ../../../mcp-servers/automation/node && pnpm install --frozen-lockfile
      - name: Build MCP servers
        run: |
          cd mcp-servers/platform/node && pnpm run build
          cd ../../../mcp-servers/automation/node && pnpm run build
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tests/node
      - name: Run tests
        run: pnpm exec vitest run
        working-directory: tests/node

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt
          pip install -r mcp-servers/platform/python/requirements.txt
          pip install -r mcp-servers/automation/python/requirements.txt
      - name: Run tests
        run: python -m pytest tests/python/ -v
