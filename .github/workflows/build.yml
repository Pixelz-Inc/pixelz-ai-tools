name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-and-test only: no job here writes to the repo, so drop the default token scopes.
permissions:
  contents: read

jobs:
  build-platform-mcp:
    name: Build Platform MCP (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mcp-servers/platform/node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/platform/node
      - name: Build TypeScript
        run: pnpm run build
        working-directory: mcp-servers/platform/node

  build-automation-mcp:
    name: Build Automation MCP (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mcp-servers/automation/node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/automation/node
      - name: Build TypeScript
        run: pnpm run build
        working-directory: mcp-servers/automation/node

  test-node:
    name: Test (Node.js)
    runs-on: ubuntu-latest
    # No `needs:` on the build jobs: the tests import the servers' src/ (not build/), so all three
    # jobs run in parallel and the build jobs stay a pure compile check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            mcp-servers/platform/node/pnpm-lock.yaml
            mcp-servers/automation/node/pnpm-lock.yaml
            tests/node/pnpm-lock.yaml
      # The cliFlags tests assert Node and Python send identical API params, so they
      # shell out to `python cli.py` -- this job needs the Python CLI's deps too.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # pip 26.1+ understands P7D; 26.2.1 is the newest release past the 7-day window itself.
      - name: Pin pip
        run: python -m pip install pip==26.2.1
      - name: Install Python CLI dependencies
        run: pip install -r requirements.txt
        env:
          # 7-day release quarantine for the transitive dependencies the requirements files don't pin.
          PIP_UPLOADED_PRIOR_TO: P7D
      - name: Install MCP server dependencies
        run: |
          cd mcp-servers/platform/node && pnpm install --frozen-lockfile
          cd ../../../mcp-servers/automation/node && pnpm install --frozen-lockfile
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tests/node
      - name: Type-check CLI tools
        run: pnpm exec tsc -p tsconfig.clitools.json
        working-directory: tests/node
      - name: Run tests
        run: pnpm exec vitest run
        working-directory: tests/node

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pin pip
        run: python -m pip install pip==26.2.1
      - name: Install dependencies
        env:
          PIP_UPLOADED_PRIOR_TO: P7D
        run: |
          pip install -r tests/python/requirements.txt
          pip install -r mcp-servers/platform/python/requirements.txt
          pip install -r mcp-servers/automation/python/requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: python -m pytest tests/python/ -v
