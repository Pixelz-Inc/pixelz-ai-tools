name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-and-test only: no job here writes to the repo, so drop the default token scopes.
permissions:
  contents: read

jobs:
  build-platform-mcp:
    name: Build Platform MCP (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mcp-servers/platform/node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/platform/node
      - name: Build TypeScript
        run: pnpm run build
        working-directory: mcp-servers/platform/node

  build-automation-mcp:
    name: Build Automation MCP (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: mcp-servers/automation/node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/automation/node
      - name: Build TypeScript
        run: pnpm run build
        working-directory: mcp-servers/automation/node

  test-node:
    name: Test (Node.js ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24 is the supported floor (engines >=24.11.0), 26 the active LTS.
        os: [ubuntu-latest]
        node: ['24', '26']
        include:
          # Windows is shipped to (PowerShell installer, Windows-specific code paths), so test it once.
          - os: windows-latest
            node: '24'
    # No `needs:` on the build jobs: the tests import the servers' src/ (not build/), so all three
    # jobs run in parallel and the build jobs stay a pure compile check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: |
            mcp-servers/platform/node/pnpm-lock.yaml
            mcp-servers/automation/node/pnpm-lock.yaml
            tests/node/pnpm-lock.yaml
      # The cliFlags tests assert Node and Python send identical API params, so they
      # shell out to `python cli.py`, and toolParity imports the Python servers to compare
      # their tool lists with Node's -- this job needs the Python CLI and server deps too.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # pip 26.1+ understands P7D; 26.2.1 is the newest release past the 7-day window itself.
      - name: Pin pip
        run: python -m pip install pip==26.2.1
      - name: Install Python CLI and server dependencies
        run: pip install -r requirements.txt -r mcp-servers/platform/python/requirements.txt -r mcp-servers/automation/python/requirements.txt
        env:
          # 7-day release quarantine for the transitive dependencies the requirements files don't pin.
          PIP_UPLOADED_PRIOR_TO: P7D
      # Separate steps with working-directory so the same YAML runs under bash and pwsh.
      - name: Install Platform MCP server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/platform/node
      - name: Install Automation MCP server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp-servers/automation/node
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tests/node
      - name: Type-check CLI tools
        run: pnpm exec tsc -p tsconfig.clitools.json
        working-directory: tests/node
      - name: Run tests
        run: pnpm exec vitest run
        working-directory: tests/node
        env:
          # Makes CI-gated test behaviour (and vitest's non-watch defaults) explicit on every runner.
          CI: 'true'

  test-python:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the supported floor (and what the other jobs use), 3.14 a current release.
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pin pip
        run: python -m pip install pip==26.2.1
      - name: Install dependencies
        env:
          PIP_UPLOADED_PRIOR_TO: P7D
        run: |
          pip install -r tests/python/requirements.txt
          pip install -r mcp-servers/platform/python/requirements.txt
          pip install -r mcp-servers/automation/python/requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: python -m pytest tests/python/ -v

  lint-ubuntu:
    name: Lint (workspace copies, shell installers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The header of pnpm-workspace.yaml requires all four copies to change together.
      - name: Check pnpm-workspace.yaml copies are identical
        shell: bash
        run: |
          for f in mcp-servers/platform/node mcp-servers/automation/node tests/node; do
            cmp pnpm-workspace.yaml "$f/pnpm-workspace.yaml" || { echo "::error::$f/pnpm-workspace.yaml differs from the root copy"; exit 1; }
          done
      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: ShellCheck installers
        run: shellcheck --severity=error scripts/*.sh

  lint-windows:
    name: Lint (PowerShell installers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PSScriptAnalyzer is preinstalled on windows-latest (runner-images Windows2025-Readme), so no unpinned module install.
      - name: PSScriptAnalyzer installers
        run: Invoke-ScriptAnalyzer -Path scripts -Severity Error -EnableExit
