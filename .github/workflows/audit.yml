name: Audit

# Separate from build.yml so a newly published advisory does not turn unrelated PRs red.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [., mcp-servers/platform/node, mcp-servers/automation/node, tests/node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — the action errors out if pnpm is declared both
      # here and as `packageManager` in the root package.json, which is the exact pin.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit
        run: pnpm audit
        working-directory: ${{ matrix.dir }}

  pip-audit:
    name: pip-audit (${{ matrix.req }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        req:
          - requirements.txt
          - mcp-servers/platform/python/requirements.txt
          - mcp-servers/automation/python/requirements.txt
          - tests/python/requirements.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # pip 26.1+ understands P7D; 26.2.1 is the newest release past the 7-day window itself.
      - name: Pin pip
        run: python -m pip install pip==26.2.1
      # pip-audit 2.10.1 was published 2026-06-10 on PyPI (well past the 7-day quarantine).
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
        env:
          PIP_UPLOADED_PRIOR_TO: P7D
      - name: Audit
        run: pip-audit -r ${{ matrix.req }}
        env:
          # pip-audit resolves the requirements into a scratch venv; hold that resolve to the quarantine too.
          PIP_UPLOADED_PRIOR_TO: P7D
