# Dependabot (rather than Renovate) because it needs no app installation.
# Every ecosystem has a 7-day cooldown so update PRs respect the project's 7-day release quarantine
# (cooldown applies to version updates only; security updates are not delayed).
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/mcp-servers/platform/node"
      - "/mcp-servers/automation/node"
      - "/tests/node"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per ecosystem instead of one per package per directory: the same package is pinned
    # in several directories and must move together (zod in the servers and the tests).
    groups:
      all:
        patterns: ["*"]
    ignore:
      # Typings follow the oldest supported Node line, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/mcp-servers/platform/python"
      - "/mcp-servers/automation/python"
      - "/tests/python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per ecosystem instead of one per package per directory: the same package is pinned
    # in several directories and must move together (zod in the servers and the tests).
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per ecosystem instead of one per package per directory: the same action is pinned
    # in both workflows.
    groups:
      all:
        patterns: ["*"]
